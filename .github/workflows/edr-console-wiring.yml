name: Wire deep EDR console

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  wire:
    if: github.head_ref == 'feat/deep-edr-console'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/deep-edr-console
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wire EDR and SIEM pivots
        run: |
          python - <<'PY'
          from pathlib import Path

          siem_path = Path('apps/web/src/SiemWorkspace.tsx')
          siem = siem_path.read_text()

          if 'initialQuery?: string;' not in siem:
              marker = '  records: readonly SiemEventRecord[];\n  finalized: boolean;'
              replacement = '  records: readonly SiemEventRecord[];\n  initialQuery?: string;\n  finalized: boolean;'
              if marker not in siem:
                  raise SystemExit('SIEM props marker not found')
              siem = siem.replace(marker, replacement, 1)

          if '  initialQuery,\n  finalized,' not in siem:
              marker = 'export function SiemWorkspace({\n  records,\n  finalized,'
              replacement = 'export function SiemWorkspace({\n  records,\n  initialQuery,\n  finalized,'
              if marker not in siem:
                  raise SystemExit('SIEM destructuring marker not found')
              siem = siem.replace(marker, replacement, 1)

          if 'useState(initialQuery ?? "")' not in siem:
              marker = '  const [query, setQuery] = useState("");'
              replacement = '  const [query, setQuery] = useState(initialQuery ?? "");'
              if marker not in siem:
                  raise SystemExit('SIEM query state marker not found')
              siem = siem.replace(marker, replacement, 1)

          siem_path.write_text(siem)

          app_path = Path('apps/web/src/App.tsx')
          app = app_path.read_text()

          if 'from "./EdrWorkspace"' not in app:
              marker = '''import {
            SiemWorkspace,
          } from "./SiemWorkspace";
          '''
              replacement = marker + '''
          import {
            EdrWorkspace,
          } from "./EdrWorkspace";
          '''
              if marker not in app:
                  raise SystemExit('SIEM import marker not found')
              app = app.replace(marker, replacement, 1)

          if 'const [siemPivot, setSiemPivot]' not in app:
              marker = '''  const [caseError, setCaseError] =
            useState<string | null>(null);
          '''
              replacement = marker + '''  const [siemPivot, setSiemPivot] =
            useState({
              query: "",
              nonce: 0,
            });
          '''
              if marker not in app:
                  raise SystemExit('caseError state marker not found')
              app = app.replace(marker, replacement, 1)

          if 'const openSiem = (' not in app:
              marker = '  const resetScenario = () => {'
              insertion = '''  const openSiem = (
            query: string,
          ) => {
            setSiemPivot((current) => ({
              query,
              nonce: current.nonce + 1,
            }));
            setActiveView("siem");
          };

          '''
              if marker not in app:
                  raise SystemExit('reset marker not found')
              app = app.replace(marker, insertion + marker, 1)

          old_siem = '''        {activeView === "siem" && (
                    <section className="workspace-section siem-section">
                      <SiemWorkspace
                        records={projections.siem.events}
                        finalized={scenarioState.finalized}
                        isCollected={isEvidenceCollected}
                        onCollect={collectEvidence}
                        onOpenCase={() => setActiveView("case")}
                      />
                    </section>
                  )}
          '''
          new_siem = '''        {activeView === "siem" && (
                    <section className="workspace-section siem-section">
                      <SiemWorkspace
                        key={`siem-${siemPivot.nonce}`}
                        records={projections.siem.events}
                        initialQuery={siemPivot.query}
                        finalized={scenarioState.finalized}
                        isCollected={isEvidenceCollected}
                        onCollect={collectEvidence}
                        onOpenCase={() => setActiveView("case")}
                      />
                    </section>
                  )}
          '''
          if 'initialQuery={siemPivot.query}' not in app:
              if old_siem not in app:
                  raise SystemExit('SIEM render marker not found')
              app = app.replace(old_siem, new_siem, 1)

          endpoint_start = '        {activeView === "endpoint" && ('
          identity_start = '        {activeView === "identity" && ('
          start = app.find(endpoint_start)
          end = app.find(identity_start, start)
          if start < 0 or end < 0:
              raise SystemExit('endpoint render boundaries not found')

          if '<EdrWorkspace' not in app[start:end]:
              edr_block = '''        {activeView === "endpoint" && (
                    <section className="workspace-section edr-section">
                      <EdrWorkspace
                        state={projections.edr}
                        devices={Object.values(scenarioState.world.devices)}
                        initialDeviceId={context.deviceId}
                        finalized={scenarioState.finalized}
                        isCollected={isEvidenceCollected}
                        onCollect={collectEvidence}
                        onSearchSiem={openSiem}
                        onOpenCase={() => setActiveView("case")}
                      />
                    </section>
                  )}

          '''
              app = app[:start] + edr_block + app[end:]

          app_path.write_text(app)
          PY

      - name: Enrich Finance endpoint process ancestry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('apps/web/public/scenarios/account-compromise.json')
          data = json.loads(path.read_text())
          scenario = data['scenario']
          world = scenario['initialWorld']
          events = scenario['openingEvents']

          if not any(f['id'] == 'file-fin-quarterly-review-docm' for f in world['files']):
              world['files'].append({
                  'id': 'file-fin-quarterly-review-docm',
                  'organizationId': 'org-acme',
                  'name': 'QuarterlyReview.docm',
                  'path': 'C:\\Users\\smartinez\\Downloads\\QuarterlyReview.docm',
                  'classification': 'internal',
                  'ownerUserId': 'user-sarah-martinez',
                  'deviceId': 'device-fin-lt-04',
              })

          def insert_before(target_id, event):
              if any(existing['id'] == event['id'] for existing in events):
                  return
              index = next(i for i, existing in enumerate(events) if existing['id'] == target_id)
              events.insert(index, event)

          insert_before('noise-process-fin-teams', {
              'id': 'event-fin-explorer',
              'type': 'PROCESS_STARTED',
              'timestamp': '2026-08-20T14:53:00Z',
              'source': 'edr',
              'actorId': 'account-smartinez',
              'subjectId': 'device-fin-lt-04',
              'payload': {
                  'deviceId': 'device-fin-lt-04',
                  'processId': '1020',
                  'image': 'C:\\Windows\\explorer.exe',
                  'commandLine': 'C:\\Windows\\explorer.exe',
                  'accountId': 'account-smartinez',
              },
          })

          insert_before('event-compromise-powershell', {
              'id': 'event-compromise-file-executed',
              'type': 'FILE_ACCESSED',
              'timestamp': '2026-08-20T15:03:05Z',
              'source': 'edr',
              'actorId': 'account-smartinez',
              'subjectId': 'device-fin-lt-04',
              'payload': {
                  'fileId': 'file-fin-quarterly-review-docm',
                  'operation': 'execute',
                  'deviceId': 'device-fin-lt-04',
                  'accountId': 'account-smartinez',
              },
          })

          insert_before('event-compromise-powershell', {
              'id': 'event-compromise-winword',
              'type': 'PROCESS_STARTED',
              'timestamp': '2026-08-20T15:03:10Z',
              'source': 'edr',
              'actorId': 'account-smartinez',
              'subjectId': 'device-fin-lt-04',
              'payload': {
                  'deviceId': 'device-fin-lt-04',
                  'processId': '6172',
                  'image': 'C:\\Program Files\\Microsoft Office\\root\\Office16\\WINWORD.EXE',
                  'commandLine': 'WINWORD.EXE "C:\\Users\\smartinez\\Downloads\\QuarterlyReview.docm"',
                  'parentProcessId': '1020',
                  'accountId': 'account-smartinez',
              },
          })

          alert = next(event for event in events if event['id'] == 'event-compromise-alert')
          related = alert['payload']['relatedEventIds']
          for event_id in ['event-compromise-file-executed', 'event-compromise-winword']:
              if event_id not in related:
                  powershell_index = related.index('event-compromise-powershell')
                  related.insert(powershell_index, event_id)

          timeline = scenario['groundTruth']['timeline']
          if not any(item['eventId'] == 'event-compromise-file-executed' for item in timeline):
              powershell_index = next(i for i, item in enumerate(timeline) if item['eventId'] == 'event-compromise-powershell')
              timeline.insert(powershell_index, {
                  'eventId': 'event-compromise-file-executed',
                  'significance': 'A macro-enabled document in the user Downloads folder was executed immediately before suspicious child processes appeared.',
              })
              timeline.insert(powershell_index + 1, {
                  'eventId': 'event-compromise-winword',
                  'significance': 'WINWORD.EXE opened the synthetic macro-enabled document and became the observed parent of the encoded PowerShell process.',
              })

          path.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Commit EDR wiring and fixture
        run: |
          if git diff --quiet; then
            echo "No EDR wiring changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/web/src/App.tsx apps/web/src/SiemWorkspace.tsx apps/web/public/scenarios/account-compromise.json
          git commit -m "feat: wire deep EDR investigation workflow"
          git push origin HEAD:feat/deep-edr-console
