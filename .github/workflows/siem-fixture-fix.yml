name: Normalize SIEM fixture

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  normalize:
    if: github.head_ref == 'feat/deep-siem-workspace'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/deep-siem-workspace
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize file entity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('apps/web/public/scenarios/account-compromise.json')
          data = json.loads(path.read_text())
          files = data['scenario']['initialWorld']['files']
          target = next(item for item in files if item['id'] == 'file-fin-quarterly-report')
          target.pop('status', None)
          target['classification'] = 'confidential'
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Commit normalization
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/web/public/scenarios/account-compromise.json
          git commit -m "fix: normalize SIEM fixture file entity"
          git push origin HEAD:feat/deep-siem-workspace
