name: Add response-quality scenario choice

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feat/response-quality'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/response-quality

      - name: Add harmful response choice
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path('apps/web/public/scenarios/account-compromise.json')
          data = json.loads(path.read_text())
          scenario = data['scenario']

          harmful_id = 'restore_compromised_account_access'
          if not any(action['id'] == harmful_id for action in scenario['actions']):
              scenario['actions'].append({
                  'id': harmful_id,
                  'label': 'Restore account access',
                  'description': 'Re-enable the affected identity account so the user can resume authentication.',
                  'assessment': {
                      'penalty': 25,
                      'rationale': 'Re-enabling a known compromised account during incident response creates avoidable exposure and can undo containment.'
                  },
                  'events': [{
                      'id': 'event-response-account-enabled',
                      'type': 'ACCOUNT_ENABLED',
                      'timestamp': '2026-08-20T15:05:00Z',
                      'source': 'identity',
                      'subjectId': 'user-sarah-martinez',
                      'payload': {
                          'accountId': 'account-smartinez',
                          'reason': 'Analyst restored access to the affected account during incident response.'
                      }
                  }]
              })

          response_ids = scenario['investigation']['responseActionIds']
          if harmful_id not in response_ids:
              response_ids.append(harmful_id)

          path.write_text(json.dumps(data, indent=2) + '\n')

      - name: Commit scenario update
        shell: bash
        run: |
          if git diff --quiet -- apps/web/public/scenarios/account-compromise.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/web/public/scenarios/account-compromise.json
          git commit -m "feat: add harmful response choice"
          git push origin HEAD:feat/response-quality
