name: Capture visual theme previews

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  capture:
    if: github.head_ref == 'feat/visual-system-retro-ops'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build app
        run: pnpm build

      - name: Capture theme previews
        run: |
          pnpm --filter @polymorph/web exec vite --host 127.0.0.1 --port 4173 > /tmp/polymorph-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done

          mkdir -p theme-previews

          node <<'NODE'
          const { chromium } = require('@playwright/test');

          (async () => {
            const browser = await chromium.launch();
            const context = await browser.newContext({
              viewport: { width: 1600, height: 1000 },
              deviceScaleFactor: 1,
            });
            const page = await context.newPage();

            for (const theme of ['midnight', 'graphite', 'retro']) {
              await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
              await page.getByLabel('Select interface style').selectOption(theme);
              await page.waitForTimeout(250);
              await page.screenshot({
                path: `theme-previews/${theme}-alerts.png`,
                fullPage: true,
              });

              const rangeButton = page.getByRole('button', { name: 'Range', exact: true });
              if (await rangeButton.count()) {
                await rangeButton.click();
                await page.waitForTimeout(250);
                await page.screenshot({
                  path: `theme-previews/${theme}-range.png`,
                  fullPage: true,
                });
              }
            }

            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Upload visual previews
        uses: actions/upload-artifact@v4
        with:
          name: polymorph-theme-previews
          path: theme-previews
          if-no-files-found: error
