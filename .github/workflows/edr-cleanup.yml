name: Clean EDR integration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  clean:
    if: github.head_ref == 'feat/deep-edr-console'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/deep-edr-console
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove superseded shallow endpoint locals
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/App.tsx')
          text = path.read_text()
          start_marker = '  const process =\n'
          end_marker = '  const loginActivity =\n'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start >= 0 and end >= 0:
              text = text[:start] + text[end:]
              path.write_text(text)
          elif start >= 0 or end < 0:
              raise SystemExit('unexpected shallow endpoint local markers')
          PY

      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/web/src/App.tsx
          git commit -m "fix: remove superseded endpoint locals"
          git push origin HEAD:feat/deep-edr-console
