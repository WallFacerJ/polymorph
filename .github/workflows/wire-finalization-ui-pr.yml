name: Wire finalization UI on PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  wire:
    if: github.head_ref == 'feat/investigation-finalization'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/investigation-finalization

      - name: Wire finalization into investigation workspace
        shell: python
        run: |
          from pathlib import Path

          path = Path("apps/web/src/App.tsx")
          text = path.read_text()
          original = text

          if "  finalizeScenarioState,\n" not in text:
              marker = "  edrProjection,\n  getScenarioState,\n"
              if marker not in text:
                  raise SystemExit("simulation import marker not found")
              text = text.replace(
                  marker,
                  "  edrProjection,\n  finalizeScenarioState,\n  getScenarioState,\n",
                  1,
              )

          state_marker = (
              '  const [performedActionIds, setPerformedActionIds] =\n'
              '    useState<string[]>([]);\n'
          )
          state_replacement = (
              '  const [performedActionIds, setPerformedActionIds] =\n'
              '    useState<string[]>([]);\n'
              '  const [finalized, setFinalized] =\n'
              '    useState(false);\n'
          )
          if 'const [finalized, setFinalized]' not in text:
              if state_marker not in text:
                  raise SystemExit("performed action state marker not found")
              text = text.replace(
                  state_marker,
                  state_replacement,
                  1,
              )

          old_state = (
              '  const scenarioState = useMemo(\n'
              '    () =>\n'
              '      getScenarioState(\n'
              '        scenario,\n'
              '        performedActionIds,\n'
              '      ),\n'
              '    [\n'
              '      scenario,\n'
              '      performedActionIds,\n'
              '    ],\n'
              '  );\n'
          )
          new_state = (
              '  const scenarioState = useMemo(\n'
              '    () =>\n'
              '      finalized\n'
              '        ? finalizeScenarioState(\n'
              '            scenario,\n'
              '            performedActionIds,\n'
              '          )\n'
              '        : getScenarioState(\n'
              '            scenario,\n'
              '            performedActionIds,\n'
              '          ),\n'
              '    [\n'
              '      scenario,\n'
              '      performedActionIds,\n'
              '      finalized,\n'
              '    ],\n'
              '  );\n'
          )
          if 'finalizeScenarioState(' not in text.split('const scenarioState', 1)[-1].split('const projections', 1)[0]:
              if old_state not in text:
                  raise SystemExit("scenario state marker not found")
              text = text.replace(
                  old_state,
                  new_state,
                  1,
              )

          old_complete = (
              '  const responseComplete =\n'
              '    scenarioState.outcome.status ===\n'
              '    "succeeded";\n'
          )
          new_complete = (
              '  const responseSucceeded =\n'
              '    scenarioState.outcome.status ===\n'
              '    "succeeded";\n'
              '\n'
              '  const runStatusLabel =\n'
              '    scenarioState.finalized\n'
              '      ? responseSucceeded\n'
              '        ? "Succeeded"\n'
              '        : "Failed"\n'
              '      : responseSucceeded\n'
              '        ? "Objectives met"\n'
              '        : performedActionIds.length > 0\n'
              '          ? "Response in progress"\n'
              '          : "Needs action";\n'
          )
          if 'const runStatusLabel =' not in text:
              if old_complete not in text:
                  raise SystemExit("response complete marker not found")
              text = text.replace(
                  old_complete,
                  new_complete,
                  1,
              )

          old_guard = (
              '    if (\n'
              '      performedActionIds.includes(\n'
              '        actionId,\n'
              '      ) ||\n'
          )
          new_guard = (
              '    if (\n'
              '      scenarioState.finalized ||\n'
              '      performedActionIds.includes(\n'
              '        actionId,\n'
              '      ) ||\n'
          )
          if 'scenarioState.finalized ||\n      performedActionIds.includes' not in text:
              if old_guard not in text:
                  raise SystemExit("response action guard marker not found")
              text = text.replace(
                  old_guard,
                  new_guard,
                  1,
              )

          reset_marker = '  const resetScenario = () => {\n'
          finalize_block = (
              '  const finalizeInvestigation = () => {\n'
              '    if (scenarioState.finalized) {\n'
              '      return;\n'
              '    }\n'
              '\n'
              '    setFinalized(true);\n'
              '    setActiveView("timeline");\n'
              '  };\n'
              '\n'
          )
          if 'const finalizeInvestigation =' not in text:
              if reset_marker not in text:
                  raise SystemExit("reset marker not found")
              text = text.replace(
                  reset_marker,
                  finalize_block + reset_marker,
                  1,
              )

          reset_actions = (
              '  const resetScenario = () => {\n'
              '    setPerformedActionIds([]);\n'
          )
          reset_replacement = (
              '  const resetScenario = () => {\n'
              '    setPerformedActionIds([]);\n'
              '    setFinalized(false);\n'
          )
          if 'setFinalized(false);' not in text:
              if reset_actions not in text:
                  raise SystemExit("reset actions marker not found")
              text = text.replace(
                  reset_actions,
                  reset_replacement,
                  1,
              )

          old_status = (
              '            <span\n'
              '              className={\n'
              '                responseComplete\n'
              '                  ? "incident-state contained"\n'
              '                  : "incident-state active"\n'
              '              }\n'
              '            >\n'
              '              {responseComplete\n'
              '                ? "Response complete"\n'
              '                : performedActionIds.length > 0\n'
              '                  ? "Response in progress"\n'
              '                  : "Needs action"}\n'
              '            </span>\n'
          )
          new_status = (
              '            <span\n'
              '              className={\n'
              '                scenarioState.finalized &&\n'
              '                responseSucceeded\n'
              '                  ? "incident-state contained"\n'
              '                  : "incident-state active"\n'
              '              }\n'
              '            >\n'
              '              {runStatusLabel}\n'
              '            </span>\n'
          )
          if '{runStatusLabel}' not in text:
              if old_status not in text:
                  raise SystemExit("topbar status marker not found")
              text = text.replace(
                  old_status,
                  new_status,
                  1,
              )

          heading = (
              '            <div className="section-heading">\n'
              '              <div>\n'
              '                <p className="eyebrow">\n'
              '                  Investigation\n'
              '                </p>\n'
              '                <h3>Correlated incident timeline</h3>\n'
              '              </div>\n'
              '            </div>\n'
          )
          heading_with_finalize = (
              '            <div className="section-heading">\n'
              '              <div>\n'
              '                <p className="eyebrow">\n'
              '                  Investigation\n'
              '                </p>\n'
              '                <h3>Correlated incident timeline</h3>\n'
              '              </div>\n'
              '\n'
              '              <button\n'
              '                type="button"\n'
              '                className="primary-button"\n'
              '                onClick={finalizeInvestigation}\n'
              '                disabled={scenarioState.finalized}\n'
              '              >\n'
              '                {scenarioState.finalized\n'
              '                  ? "Investigation finalized"\n'
              '                  : "Finalize investigation"}\n'
              '              </button>\n'
              '            </div>\n'
          )
          if 'onClick={finalizeInvestigation}' not in text:
              if heading not in text:
                  raise SystemExit("investigation heading marker not found")
              text = text.replace(
                  heading,
                  heading_with_finalize,
                  1,
              )

          response_props = (
              '            <ResponseActionPanel\n'
              '              actions={responseActions}\n'
              '              performedActionIds={scenarioState.performedActionIds}\n'
              '              score={scenarioState.score}\n'
              '              onPerform={performResponseAction}\n'
              '            />\n'
          )
          response_props_finalized = (
              '            <ResponseActionPanel\n'
              '              actions={responseActions}\n'
              '              performedActionIds={scenarioState.performedActionIds}\n'
              '              score={scenarioState.score}\n'
              '              finalized={scenarioState.finalized}\n'
              '              onPerform={performResponseAction}\n'
              '            />\n'
          )
          if 'finalized={scenarioState.finalized}' not in text:
              if response_props not in text:
                  raise SystemExit("response panel props marker not found")
              text = text.replace(
                  response_props,
                  response_props_finalized,
                  1,
              )

          old_result = (
              '            {scenarioState.outcome.status === "succeeded" && (\n'
              '              <ScenarioResultPanel\n'
              '                score={scenarioState.score}\n'
          )
          new_result = (
              '            {scenarioState.finalized && (\n'
              '              <ScenarioResultPanel\n'
              '                status={scenarioState.outcome.status}\n'
              '                score={scenarioState.score}\n'
          )
          if 'status={scenarioState.outcome.status}' not in text:
              if old_result not in text:
                  raise SystemExit("result panel marker not found")
              text = text.replace(
                  old_result,
                  new_result,
                  1,
              )

          if text != original:
              path.write_text(text)

      - name: Commit finalization wiring
        shell: bash
        run: |
          if git diff --quiet -- apps/web/src/App.tsx; then
            echo "Finalization UI is already wired."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/web/src/App.tsx
          git commit -m "feat: let analysts finalize investigations"
          git push origin HEAD:feat/investigation-finalization
