name: Wire remediation action UI

on:
  push:
    branches:
      - feat/multiple-remediation-choices

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/multiple-remediation-choices

      - name: Wire response action panel
        shell: python
        run: |
          from pathlib import Path

          path = Path("apps/web/src/App.tsx")
          text = path.read_text()
          original = text

          result_import = '''import {
            ScenarioResultPanel,
          } from "./ScenarioResultPanel";
          '''
          response_import = '''import {
            ResponseActionPanel,
          } from "./ResponseActionPanel";
          '''
          if 'from "./ResponseActionPanel"' not in text:
              if result_import not in text:
                  raise SystemExit("ScenarioResultPanel import marker not found")
              text = text.replace(
                  result_import,
                  result_import + "\n" + response_import,
                  1,
              )

          old_selection = '''  const primaryAction =
            scenario.actions.find(
              (action) =>
                action.id ===
                context.primaryActionId,
            );

          const contained =
            performedActionIds.includes(
              context.primaryActionId,
            );
          '''
          new_selection = '''  const responseActions =
            context.responseActionIds.flatMap(
              (actionId) => {
                const action =
                  scenario.actions.find(
                    (candidate) =>
                      candidate.id === actionId,
                  );

                return action ? [action] : [];
              },
            );

          const responseComplete =
            scenarioState.outcome.status ===
            "succeeded";
          '''
          if 'const responseActions =' not in text:
              if old_selection not in text:
                  raise SystemExit("primary action selection marker not found")
              text = text.replace(
                  old_selection,
                  new_selection,
                  1,
              )

          old_handler = '''  const containIncident = () => {
            if (contained || !primaryAction) {
              return;
            }

            setPerformedActionIds((current) => [
              ...current,
              primaryAction.id,
            ]);
            setActiveView("timeline");
          };
          '''
          new_handler = '''  const performResponseAction = (
            actionId: string,
          ) => {
            if (
              performedActionIds.includes(
                actionId,
              ) ||
              !responseActions.some(
                (action) =>
                  action.id === actionId,
              )
            ) {
              return;
            }

            setPerformedActionIds((current) =>
              current.includes(actionId)
                ? current
                : [
                    ...current,
                    actionId,
                  ],
            );
            setActiveView("timeline");
          };
          '''
          if 'const performResponseAction =' not in text:
              if old_handler not in text:
                  raise SystemExit("containIncident handler marker not found")
              text = text.replace(
                  old_handler,
                  new_handler,
                  1,
              )

          old_status = '''            <span
                        className={
                          contained
                            ? "incident-state contained"
                            : "incident-state active"
                        }
                      >
                        {contained
                          ? "Contained"
                          : "Needs action"}
                      </span>
          '''
          new_status = '''            <span
                        className={
                          responseComplete
                            ? "incident-state contained"
                            : "incident-state active"
                        }
                      >
                        {responseComplete
                          ? "Response complete"
                          : performedActionIds.length > 0
                            ? "Response in progress"
                            : "Needs action"}
                      </span>
          '''
          if '"Response complete"' not in text:
              if old_status not in text:
                  raise SystemExit("topbar status marker not found")
              text = text.replace(
                  old_status,
                  new_status,
                  1,
              )

          old_heading_button = '''

                      <button
                        type="button"
                        className="primary-button"
                        onClick={containIncident}
                        disabled={contained}
                      >
                        {contained
                          ? "Incident contained"
                          : primaryAction?.label ??
                            "Perform response"}
                      </button>
          '''
          if 'onClick={containIncident}' in text:
              if old_heading_button not in text:
                  raise SystemExit("investigation response button marker not found")
              text = text.replace(
                  old_heading_button,
                  "",
                  1,
              )

          outcome_panel = '''            <ScenarioOutcomePanel
                        outcome={scenarioState.outcome}
                      />
          '''
          response_panel = '''            <ScenarioOutcomePanel
                        outcome={scenarioState.outcome}
                      />

                      <ResponseActionPanel
                        actions={responseActions}
                        performedActionIds={scenarioState.performedActionIds}
                        score={scenarioState.score}
                        onPerform={performResponseAction}
                      />
          '''
          if '<ResponseActionPanel' not in text:
              if outcome_panel not in text:
                  raise SystemExit("outcome panel marker not found")
              text = text.replace(
                  outcome_panel,
                  response_panel,
                  1,
              )

          if text != original:
              path.write_text(text)

      - name: Commit wiring
        shell: bash
        run: |
          if git diff --quiet -- apps/web/src/App.tsx; then
            echo "Remediation UI is already wired."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/web/src/App.tsx
          git commit -m "feat: let analysts choose remediation actions"
          git push origin HEAD:feat/multiple-remediation-choices
