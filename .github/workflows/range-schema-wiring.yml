                                  'protocol': 'tcp',
                                  'localAddress': '10.20.30.44',
                                  'localPort': 53110,
                                  'remoteAddress': '198.51.100.18',
                                  'remotePort': 443,
                                  'state': 'established',
                                  'processId': 4104,
                              },
                              {
                                  'id': 'range-connection-powershell',
                                  'protocol': 'tcp',
                                  'localAddress': '10.20.30.44',
                                  'localPort': 49722,
                                  'remoteAddress': '203.0.113.77',
                                  'remotePort': 443,
                                  'state': 'established',
                                  'processId': 8420,
                              },
                          ],
                      },
                  }
              ]
              scenario_path.write_text(json.dumps(payload, indent=2) + '\n')
          PY

      - name: Commit Range schema wiring
        run: |
          if git diff --quiet; then
            echo "No Range schema wiring changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- packages/schema/src/scenario.ts packages/simulation/src/scenario.ts apps/web/public/scenarios/account-compromise.json
          git commit -m "feat: author account compromise synthetic host"
          git push origin HEAD:feat/range-workspace
