                              'timestamp': '2026-08-20T15:03:19Z',
                              'channel': 'Network',
                              'level': 'warning',
                              'source': 'Synthetic Host Network',
                              'message': 'Process 8420 established a TLS connection to 203.0.113.77:443.',
                          },
                      ],
                      'network': {
                          'listeners': [
                              {
                                  'id': 'range-listener-telemetry',
