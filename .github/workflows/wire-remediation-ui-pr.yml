name: Wire remediation UI on PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  wire:
    if: github.head_ref == 'feat/multiple-remediation-choices'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/multiple-remediation-choices

      - name: Wire response action panel
        shell: python
        run: |
          from pathlib import Path

          path = Path("apps/web/src/App.tsx")
          text = path.read_text()
          original = text

          result_import = (
              'import {\n'
              '  ScenarioResultPanel,\n'
              '} from "./ScenarioResultPanel";\n'
          )
          response_import = (
              'import {\n'
              '  ResponseActionPanel,\n'
              '} from "./ResponseActionPanel";\n'
          )
          if 'from "./ResponseActionPanel"' not in text:
              if result_import not in text:
                  raise SystemExit("ScenarioResultPanel import marker not found")
              text = text.replace(
                  result_import,
                  result_import + "\n" + response_import,
                  1,
              )

          old_selection = (
              '  const primaryAction =\n'
              '    scenario.actions.find(\n'
              '      (action) =>\n'
              '        action.id ===\n'
              '        context.primaryActionId,\n'
              '    );\n'
              '\n'
              '  const contained =\n'
              '    performedActionIds.includes(\n'
              '      context.primaryActionId,\n'
              '    );\n'
          )
          new_selection = (
              '  const responseActions =\n'
              '    context.responseActionIds.flatMap(\n'
              '      (actionId) => {\n'
              '        const action =\n'
              '          scenario.actions.find(\n'
              '            (candidate) =>\n'
              '              candidate.id === actionId,\n'
              '          );\n'
              '\n'
              '        return action ? [action] : [];\n'
              '      },\n'
              '    );\n'
              '\n'
              '  const responseComplete =\n'
              '    scenarioState.outcome.status ===\n'
              '    "succeeded";\n'
          )
          if 'const responseActions =' not in text:
              if old_selection not in text:
                  raise SystemExit("primary action selection marker not found")
              text = text.replace(old_selection, new_selection, 1)

          old_handler = (
              '  const containIncident = () => {\n'
              '    if (contained || !primaryAction) {\n'
              '      return;\n'
              '    }\n'
              '\n'
              '    setPerformedActionIds((current) => [\n'
              '      ...current,\n'
              '      primaryAction.id,\n'
              '    ]);\n'
              '    setActiveView("timeline");\n'
              '  };\n'
          )
          new_handler = (
              '  const performResponseAction = (\n'
              '    actionId: string,\n'
              '  ) => {\n'
              '    if (\n'
              '      performedActionIds.includes(\n'
              '        actionId,\n'
              '      ) ||\n'
              '      !responseActions.some(\n'
              '        (action) =>\n'
              '          action.id === actionId,\n'
              '      )\n'
              '    ) {\n'
              '      return;\n'
              '    }\n'
              '\n'
              '    setPerformedActionIds((current) =>\n'
              '      current.includes(actionId)\n'
              '        ? current\n'
              '        : [\n'
              '            ...current,\n'
              '            actionId,\n'
              '          ],\n'
              '    );\n'
              '    setActiveView("timeline");\n'
              '  };\n'
          )
          if 'const performResponseAction =' not in text:
              if old_handler not in text:
                  raise SystemExit("containIncident handler marker not found")
              text = text.replace(old_handler, new_handler, 1)

          old_status = (
              '            <span\n'
              '              className={\n'
              '                contained\n'
              '                  ? "incident-state contained"\n'
              '                  : "incident-state active"\n'
              '              }\n'
              '            >\n'
              '              {contained\n'
              '                ? "Contained"\n'
              '                : "Needs action"}\n'
              '            </span>\n'
          )
          new_status = (
              '            <span\n'
              '              className={\n'
              '                responseComplete\n'
              '                  ? "incident-state contained"\n'
              '                  : "incident-state active"\n'
              '              }\n'
              '            >\n'
              '              {responseComplete\n'
              '                ? "Response complete"\n'
              '                : performedActionIds.length > 0\n'
              '                  ? "Response in progress"\n'
              '                  : "Needs action"}\n'
              '            </span>\n'
          )
          if '"Response complete"' not in text:
              if old_status not in text:
                  raise SystemExit("topbar status marker not found")
              text = text.replace(old_status, new_status, 1)

          old_button = (
              '\n'
              '              <button\n'
              '                type="button"\n'
              '                className="primary-button"\n'
              '                onClick={containIncident}\n'
              '                disabled={contained}\n'
              '              >\n'
              '                {contained\n'
              '                  ? "Incident contained"\n'
              '                  : primaryAction?.label ??\n'
              '                    "Perform response"}\n'
              '              </button>\n'
          )
          if 'onClick={containIncident}' in text:
              if old_button not in text:
                  raise SystemExit("investigation response button marker not found")
              text = text.replace(old_button, "", 1)

          outcome_panel = (
              '            <ScenarioOutcomePanel\n'
              '              outcome={scenarioState.outcome}\n'
              '            />\n'
          )
          response_panel = (
              '            <ScenarioOutcomePanel\n'
              '              outcome={scenarioState.outcome}\n'
              '            />\n'
              '\n'
              '            <ResponseActionPanel\n'
              '              actions={responseActions}\n'
              '              performedActionIds={scenarioState.performedActionIds}\n'
              '              score={scenarioState.score}\n'
              '              onPerform={performResponseAction}\n'
              '            />\n'
          )
          if '<ResponseActionPanel' not in text:
              if outcome_panel not in text:
                  raise SystemExit("outcome panel marker not found")
              text = text.replace(outcome_panel, response_panel, 1)

          if text != original:
              path.write_text(text)

      - name: Commit wiring
        shell: bash
        run: |
          if git diff --quiet -- apps/web/src/App.tsx; then
            echo "Remediation UI is already wired."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/web/src/App.tsx
          git commit -m "feat: let analysts choose remediation actions"
          git push origin HEAD:feat/multiple-remediation-choices
